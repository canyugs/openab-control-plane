name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    services:
      # ADR 033: the store suite runs against both backends. Tests that need
      # Postgres read TEST_POSTGRES_URL and skip when it is unset, so local
      # `cargo test` stays dependency-free.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: kernel purity grep gate
        # Stage 3 exit invariant (ADR 018 / plan S12): review/triage vocabulary
        # must never reappear in kernel files — the cheapest permanent
        # approximation of the kernel-purity proof, without cargo features.
        run: |
          ! grep -nE 'PR Review|gh pr|\[\[verdict|TRIAGE' \
            src/api.rs src/orchestrator.rs src/coordinator.rs src/controller.rs
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo check
        run: cargo check --locked --all-targets --all-features
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --locked --all-targets --all-features
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: cargo test doc
        run: cargo test --locked --doc --all-features
