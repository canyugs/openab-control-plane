[package]
name = "openab-control-plane"
version = "0.1.76"
edition = "2021"
license = "MIT"

[workspace]
members = [
    "crates/controller-protocol",
    "crates/github-pr-controller",
    "crates/world-controller",
]
default-members = [".", "crates/controller-protocol"]
resolver = "2"

[dependencies]
controller-protocol = { path = "crates/controller-protocol" }
axum = { version = "0.7", features = ["ws"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.23"
# Controller/event HMAC signatures (x-canary-audit-signature-256). sha2 is already a dep.
hmac = "0.12"
getrandom = "0.4"
subtle = "2"
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
rustls-native-certs = "0.8.4"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
serde_urlencoded = "0.7"
github-pr-controller = { path = "crates/github-pr-controller" }
world-controller = { path = "crates/world-controller" }
tokio-tungstenite = "0.23"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
